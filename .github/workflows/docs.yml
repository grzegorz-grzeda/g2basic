name: API documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: API documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch documentation theme
        run: git submodule update --init --depth 1 external/doxygen-awesome-css

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      # The Doxyfile sets WARN_AS_ERROR = FAIL_ON_WARNINGS. The version shown in
      # the page header is the project() version plus the short commit.
      - name: Generate API documentation
        run: |
          version="$(sed -n 's/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)"
          test -n "$version"
          G2BASIC_DOCS_VERSION="$version (${GITHUB_SHA::7})" doxygen Doxyfile

      # Uploaded on every run so pull requests can download a preview;
      # deploy-docs publishes it only for pushes to the default branch.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs

  deploy-docs:
    name: Publish API documentation
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploy one commit at a time; never cancel a deployment in progress.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
